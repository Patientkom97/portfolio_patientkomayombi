<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Patient Komayombi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a class="logo" id="logo" href="#accueil"></a>
    <button class="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" id="menuBtn">☰</button>
    <nav id="mainNav">
      <ul id="navList"></ul>
    </nav>
  </div>
</header>

<main>
  <!-- Accueil -->
  <section class="hero" id="accueil">
    <div class="container hero-grid">
      <div class="hero-text">
        <p class="greeting" id="heroGreeting"></p>
        <h1 id="heroName"></h1>
        <p class="role" id="heroRole"></p>
        <p class="intro" id="heroIntro"></p>
        <div class="btn-row" id="heroButtons"></div>
      </div>
      <div class="hero-photo" id="heroPhoto"></div>
    </div>
  </section>

  <!-- À propos -->
  <section id="a-propos">
    <div class="container about-grid reveal">
      <div>
        <p class="eyebrow" id="aboutEyebrow"></p>
        <h2 id="aboutTitle"></h2>
        <div id="aboutParagraphs"></div>
      </div>
      <ul class="facts" id="aboutFacts"></ul>
    </div>
  </section>

  <!-- Compétences -->
  <section id="competences">
    <div class="container reveal">
      <p class="eyebrow" id="skillsEyebrow"></p>
      <h2 id="skillsTitle"></h2>
      <p class="lead" id="skillsLead"></p>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <!-- Projets -->
  <section id="projets">
    <div class="container reveal">
      <p class="eyebrow" id="projectsEyebrow"></p>
      <h2 id="projectsTitle"></h2>
      <p class="lead" id="projectsLead"></p>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <!-- Parcours -->
  <section id="parcours">
    <div class="container reveal">
      <p class="eyebrow" id="timelineEyebrow"></p>
      <h2 id="timelineTitle"></h2>
      <p class="lead" id="timelineLead"></p>
      <div class="timeline" id="timelineList"></div>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact">
    <div class="container contact-grid reveal">
      <div class="contact-info">
        <p class="eyebrow" id="contactEyebrow"></p>
        <h2 id="contactTitle"></h2>
        <p id="contactLead"></p>
        <div id="contactLinks"></div>
      </div>
      <form id="contactForm" novalidate>
        <label>Nom
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Message
          <textarea name="message" required></textarea>
        </label>
        <button class="btn primary" type="submit">Envoyer</button>
        <p class="form-msg" id="formMsg" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p id="footerText"></p>
  </div>
</footer>

<!-- Terminal d'administration (ouvrir / fermer : Ctrl + Shift + A) -->
<div class="terminal hidden" id="terminal" aria-label="Terminal d'administration">
  <div class="term-head">
    <span>admin — portfolio</span>
    <span class="term-actions">
      <button type="button" id="photoBtn">Photo</button>
      <button type="button" id="termClose">Fermer</button>
    </span>
  </div>
  <div class="term-out" id="termOut" aria-live="polite"></div>
  <form class="term-input" id="termForm" autocomplete="off">
    <span class="prompt" id="termPrompt">visiteur@portfolio:~$</span>
    <input id="termIn" type="text" spellcheck="false" aria-label="Commande">
  </form>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="script.js"></script>
</body>
</html>
